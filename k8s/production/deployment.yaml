apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerave-be
  labels:
    app: cerave-be
spec:
  selector:
    matchLabels:
      app: cerave-be
  template:
    metadata:
      labels:
        app: cerave-be
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.azure.com/agentpool: backend
      containers:
      - image: swr.af-south-1.myhuaweicloud.com/tooling/cerave-be:latest
        name: cerave-be
        ports:
        - containerPort: 80
          protocol: TCP
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          limits:
            cpu: "1000m"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 512Mi
        env:
        - name: NODE_ENV
          value: production
        - name: NODE_PATH
          value: "."
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: zin-secret
              key: cerave_db_host
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: zin-secret
              key: cerave_db_username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zin-secret
              key: cerave_db_password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: zin-secret
              key: cerave_db_name
        - name: DB_PORT
          value: "3306"
        - name: NOTIFICATION_API_URL
          value: "http://hermes.igbimo.com/v1/notifications"
        - name: APP_NAME
          value: Cerave Awards
        - name: NOTIFICATION_SENDER_ID
          value: "CERAVE"
        - name: NOTIFICATION_SENDER_EMAIL
          value: "noreply@cerave.com.ng"
